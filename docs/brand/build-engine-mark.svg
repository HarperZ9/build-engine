<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Build Engine mark">
  <defs>
    <linearGradient id="be-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1030"/>
      <stop offset="1" stop-color="#0c0a1a"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#be-bg)"/>
  <!-- candlesticks: signal history -->
  <g stroke-linecap="round">
    <line x1="34" y1="58" x2="34" y2="92" stroke="#38d39f" stroke-width="2.5"/>
    <rect x="29" y="66" width="10" height="18" rx="1.5" fill="#38d39f"/>
    <line x1="52" y1="50" x2="52" y2="86" stroke="#ff4d6d" stroke-width="2.5"/>
    <rect x="47" y="58" width="10" height="16" rx="1.5" fill="#ff4d6d"/>
    <line x1="70" y1="44" x2="70" y2="80" stroke="#38d39f" stroke-width="2.5"/>
    <rect x="65" y="48" width="10" height="20" rx="1.5" fill="#38d39f"/>
  </g>
  <!-- forecast line extending beyond the last candle -->
  <polyline points="75,58 88,50 98,40 108,32" fill="none" stroke="#4636e8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 7"/>
  <circle cx="108" cy="32" r="5" fill="#4636e8"/>
  <circle cx="108" cy="32" r="2" fill="#ffffff"/>
</svg>
