<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Build Engine, a self-improving adaptive prediction and paper-trading engine">
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160c28"/>
      <stop offset="1" stop-color="#0a0816"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#hero-bg)"/>
  <!-- candlestick + forecast motif -->
  <g transform="translate(860,150)" opacity="0.95">
    <g stroke-linecap="round">
      <line x1="0" y1="20" x2="0" y2="90" stroke="#38d39f" stroke-width="6"/>
      <rect x="-12" y="38" width="24" height="34" rx="3" fill="#38d39f"/>
      <line x1="44" y1="0" x2="44" y2="70" stroke="#ff4d6d" stroke-width="6"/>
      <rect x="32" y="16" width="24" height="30" rx="3" fill="#ff4d6d"/>
      <line x1="88" y1="-24" x2="88" y2="50" stroke="#38d39f" stroke-width="6"/>
      <rect x="76" y="-10" width="24" height="38" rx="3" fill="#38d39f"/>
    </g>
    <polyline points="100,-10 130,-40 158,-64 186,-92" fill="none" stroke="#4636e8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 14"/>
    <circle cx="186" cy="-92" r="10" fill="#4636e8"/>
    <circle cx="186" cy="-92" r="4" fill="#ffffff"/>
  </g>
  <text x="80" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#ffffff">Build Engine</text>
  <text x="82" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#b8b0d8">A self-improving adaptive prediction and paper-trading engine — forecasts feed signals, results feed weights.</text>
</svg>
