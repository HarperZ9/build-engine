[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quanta-engine"
version = "1.0.0"
description = "Self-improving prediction and trading engine — integrates forecasting with automated execution"
license = {text = "Proprietary"}
authors = [{name = "Zain Dana Harper"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
quanta-engine = "quanta_engine.cli:main"

[project.optional-dependencies]
gui = ["PyQt6>=6.5,<7"]
all = ["PyQt6>=6.5,<7"]

[tool.setuptools.packages.find]
include = ["quanta_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
