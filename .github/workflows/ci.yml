name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pytest
      - name: Create cross-project stubs for CI
        shell: bash
        run: |
          mkdir -p quanta_finance quanta_oracle
          printf 'class Candle:\n    def __init__(self, **kw): self.__dict__.update(kw)\nclass Signal:\n    def __init__(self, **kw): self.__dict__.update(kw)\n' > quanta_finance/data.py
          printf '' > quanta_finance/__init__.py
          printf '' > quanta_oracle/__init__.py
          printf 'class BaseForecaster:\n    def __init__(self, **kw): self.__dict__.update(kw)\n    def fit(self, *a, **kw): return self\n    def predict(self, *a, **kw): return []\n' > quanta_oracle/forecasting.py
          printf 'class ARIMA:\n    def __init__(self, *a, **kw): pass\n    def fit(self, *a, **kw): return self\n    def predict(self, *a, **kw): return [0.0]\n' > quanta_oracle/arima.py
          printf 'class Prophet:\n    def __init__(self, *a, **kw): pass\n    def fit(self, *a, **kw): return self\n    def predict(self, *a, **kw): return [0.0]\n' > quanta_oracle/prophet.py
          printf 'class SimpleForecaster:\n    def __init__(self, *a, **kw): pass\n    def fit(self, *a, **kw): return self\n    def predict(self, *a, **kw): return [0.0]\n' > quanta_oracle/neural.py
      - name: Run tests
        run: pytest tests/ -v
