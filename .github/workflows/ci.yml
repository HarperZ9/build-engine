name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pytest
      - name: Create quanta-finance stub for CI
        run: |
          mkdir -p quanta_finance
          echo "class Candle:
              def __init__(self, **kwargs): self.__dict__.update(kwargs)
          class Signal:
              def __init__(self, **kwargs): self.__dict__.update(kwargs)" > quanta_finance/data.py
          echo "" > quanta_finance/__init__.py
      - name: Run tests
        run: pytest tests/ -v
